events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server auth-service:4000;
    }

    upstream user_service {
        server user-service:4001;
    }

    upstream post_service {
        server post-service:4002;
    }

    upstream comment_service {
        server comment-service:4004;
    }

    upstream messaging_service {
        server messaging-service:4006;
    }

    upstream language_service {
        server language-service:4007;
    }

    server {
        listen 3001;

        location = /authenticate {
            internal;
            proxy_pass http://auth_service/auth/authenticate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
            # Extraction des headers retournés
            # auth_request_set $user_id $upstream_http_x_user_id;
            # auth_request_set $user_username $upstream_http_x_user_username;
            # auth_request_set $user_role $upstream_http_x_user_role;
        }


        location /auth/ {                  
            #serveur publique
            add_header Access-Control-Allow-Origin http://localhost:3000 always;
            # En production, remplace * par le domaine https://breezy.com
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Credentials true always;
            proxy_pass http://auth_service/;
            rewrite ^/auth(/.*)$ $1 break;
        }

        location /user/ {
            auth_request /authenticate;
            add_header Access-Control-Allow-Origin http://localhost:3000 always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            #   if ($request_method = OPTIONS ) {
            #         add_header Access-Control-Allow-Origin http://localhost:3000;
            #         add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            #         add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            #         add_header Access-Control-Allow-Credentials true;
            #         return 204;
            #     }

            #     add_header Access-Control-Allow-Origin http://localhost:3000 always;
            #     add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            #     add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            #     add_header Access-Control-Allow-Credentials true always;

            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $user_id;
            auth_request_set $user_username $upstream_http_x_user_username;
            proxy_set_header X-User-Username $user_username;
            auth_request_set $user_Role $upstream_http_x_user_role;
            proxy_set_header X-User-Role $user_role;

            proxy_pass http://user_service/;
            rewrite ^/user(/.*)$ $1 break;
        }
        
        location /post/ {
            auth_request /authenticate;
            add_header Access-Control-Allow-Origin http://localhost:3000 always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;

            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $user_id;
            auth_request_set $user_username $upstream_http_x_user_username;
            proxy_set_header X-User-Username $user_username;
            auth_request_set $user_Role $upstream_http_x_user_role;
            proxy_set_header X-User-Role $user_role;

            proxy_pass http://post_service/;
            rewrite ^/post(/.*)$ $1 break;
        }

         location /comment/ {
            auth_request /authenticate;
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $user_id;
            auth_request_set $user_username $upstream_http_x_user_username;
            proxy_set_header X-User-Username $user_username;
            auth_request_set $user_Role $upstream_http_x_user_role;
            proxy_set_header X-User-Role $user_role;
            proxy_pass http://comment_service/;
            rewrite ^/comment(/.*)$ $1 break;
        }

        location /messaging/ {
            auth_request /authenticate;

            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $user_id;

            auth_request_set $user_username $upstream_http_x_user_username;
            proxy_set_header X-User-Username $user_username;

            auth_request_set $user_role $upstream_http_x_user_role;
            proxy_set_header X-User-Role $user_role;

            if ($request_method = OPTIONS ) {
                add_header Access-Control-Allow-Origin http://localhost:3000;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type";
                add_header Access-Control-Allow-Credentials true;
                return 204;
            }

            add_header Access-Control-Allow-Origin http://localhost:3000 always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;

            proxy_pass http://messaging_service/;
            rewrite ^/messaging(/.*)$ $1 break;
        }

        location /language/ {
            auth_request /authenticate;

            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $user_id;

            auth_request_set $user_username $upstream_http_x_user_username;
            proxy_set_header X-User-Username $user_username;

            auth_request_set $user_role $upstream_http_x_user_role;
            proxy_set_header X-User-Role $user_role;

            if ($request_method = OPTIONS ) {
                add_header Access-Control-Allow-Origin http://localhost:3000;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type";
                add_header Access-Control-Allow-Credentials true;
                return 204;
            }

            add_header Access-Control-Allow-Origin http://localhost:3000 always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;

            proxy_pass http://language_service/;
            rewrite ^/language(/.*)$ $1 break;
        }
    }
}
