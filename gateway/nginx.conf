events {}

http {
    upstream auth_service {
        server auth-service:4000;
    }

    upstream user_service {
        server user-service:4001;
    }

    server {
        listen 3001;

        location /auth/ {
            proxy_pass http://auth_service/;
            rewrite ^/auth(/.*)$ $1 break;
        }

        location /user/ {
            proxy_pass http://user_service/;
            rewrite ^/user(/.*)$ $1 break;
        }
    }
}
